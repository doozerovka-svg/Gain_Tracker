name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Line Endings & Permissions for gradlew
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Locate and copy APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/workout-tracker.apk
          ls -la release_apk/

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: release_apk/workout-tracker.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.2.0
          name: "Gain Tracker v2.2.0 (APK & Web)"
          body: |
            ### 🚀 Gain Tracker v2.2.0 — Quick Steps Polish & Typography Scaling

            #### 🎛️ Нововведения и улучшения в v2.2.0:
            - **Оптимизация кнопок быстрого добавления веса**:
              - Убран обрезавшийся суффикс "к", оставлены чистые числовые значения (`-5.0`, `-2.5`, `+2.5`, `+5.0`).
              - Гарантировано отсутствие переносов строк и клиппинга текста.
            - **Устойчивость к масштабированию системы (Font Scale)**:
              - Проверена и адаптирована верстка активной тренировки при увеличенных системных шрифтах (вплоть до 1.4x-1.5x).
              - Корректное сжатие и плавный скролл при открытии встроенной цифровой клавиатуры.
            - **Кинематика поворотного барабана (3D Rotary Wheel)**:
              - Синхронизировано физическое вращение цилиндра и тактильных шевронов (- / +) под естественный жест пальца.
            - **AMOLED Dark Theme (#000000)** и офлайн-прогрессия No-AI.

            #### 📦 Установка:
            - Скачайте прикрепленный файл **`workout-tracker.apk`** ниже и установите на Android (требуется Android 8.0+ / API 26+).
            - Либо используйте веб-версию на [GitHub Pages](https://doozerovka-svg.github.io/Gain_Tracker/).
          files: release_apk/workout-tracker.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
