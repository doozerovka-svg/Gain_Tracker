name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Line Endings & Permissions for gradlew
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Locate and copy APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/workout-tracker.apk
          ls -la release_apk/

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: release_apk/workout-tracker.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.0
          name: "Workout Tracker v1.2.0 (APK)"
          body: |
            ### 📱 Workout Tracker Android APK v1.2
            
            - **Файл**: `workout-tracker.apk`
            - **Версия**: v1.2 (versionCode 3)
            - **Группировка упражнений**: Все подходы текущей тренировки и в истории сгруппированы по отдельным упражнениям с тоннажем и 1RM.
            - **Адаптивный интерфейс (No-Ellipsis)**: Полное отображение рекомендаций прогрессии на экранах любого разрешения без обрезки текста.
            
            Нажмите на **workout-tracker.apk** ниже, чтобы скачать и установить на смартфон.
          files: release_apk/workout-tracker.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
