name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Line Endings & Permissions for gradlew
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Setup Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "8933fa6523473048516e4513a68f6d616857997c\nd56f5185479d0b7a439f7b3c2686b4d8c9c0f00c\n24333f8a63b1e99c309337449969d63d65ce1422\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebd7f2d4e\n" > "$SDK_ROOT/licenses/android-googletv-license"
          printf "33b6a2b64920400829152f90011b83e0b1626be0\n" > "$SDK_ROOT/licenses/google-gdk-license"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Pandroid.builder.sdkDownload=true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true

      - name: Rename APK for release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk workout-tracker.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: workout-tracker.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Workout Tracker v1.0.0 (APK)"
          body: |
            ### 📱 Workout Tracker Android APK
            
            - **Файл**: `workout-tracker.apk`
            - **Архитектура**: Local-First, Room DB, Jetpack Compose
            - **Функционал**: Новая прогрессия нагрузок (No-AI), Zero-Scroll компактный UI, таймер отдыха, экспорт Excel/PDF.
            
            Нажмите на **workout-tracker.apk** ниже, чтобы скачать и установить на смартфон.
          files: workout-tracker.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
