name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Line Endings & Permissions for gradlew
        run: |
          sed -i -e 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Locate and copy APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/workout-tracker.apk
          ls -la release_apk/

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: release_apk/workout-tracker.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.1.0
          name: "Gain Tracker v2.1.0 (APK & Web)"
          body: |
            ### 🚀 Gain Tracker v2.1.0 — 3D Rotary Picker & UI 2.0 Polish

            #### 🎛️ Нововведения в v2.1.0:
            - **3D Rotary Side-Wheel Picker (Поворотное колесо-барабан)**:
              - Тактильный барабан (Jog Dial / Volume Thumbwheel) для плавного и точного выбора веса (шаг 0.5/1.25/2.5 кг), повторений и RIR.
              - 3D-проекция цилиндра с физикой свайпа, визуальными насечками и быстрыми кнопками инкремента.
              - Web Audio / Haptic отклик при вращении.
            - **Компактная таблица подходов**:
              - Убраны громоздкие карточки со степперами. Ввод нового подхода теперь интегрирован прямо в нижнюю строку таблицы упражнения.
              - Клик по значению веса, повторений или RIR плавно разворачивает 3D-барабан прямо под строкой.
            - **AMOLED Dark Theme (#000000)**:
              - Полная оптимизация контраста и расхода батареи для OLED-экранов.
            - **Система No-AI прогрессии и периодизации**:
              - Автоматический расчет рабочих весов без обращения к облаку.
              - Детектор переутомления ЦНС и советник разгрузочных недель (Deload Advisor).
            - **Калькулятор олимпийских блинов & Быстрая замена тренажеров**:
              - Визуальная раскладка блинов для любого штангового грифа.
              - Замена упражнения в 1 клик на аналоги для той же мышечной группы.
            - **Полный офлайн-экспорт/импорт (JSON)**.

            #### 📦 Установка:
            - Скачайте прикрепленный файл **`workout-tracker.apk`** ниже и установите на Android (требуется Android 8.0+ / API 26+).
            - Либо используйте веб-версию на [GitHub Pages](https://doozerovka-svg.github.io/Gain_Tracker/).
          files: release_apk/workout-tracker.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
